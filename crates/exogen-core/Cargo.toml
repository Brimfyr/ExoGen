[package]
name = "exogen-core"
description = "ExoGen engine: process-based planetary map generation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The whole-body tests: each body's pipeline, its climate's year, its loop and its finish,
# minutes each; left out of the fast tier run while iterating and run before each milestone
# (`cargo nextest run --features whole-body`).
whole-body = []

[dependencies]
exr = "1.74.2"
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.3"
thiserror = "2.0.21"
toml = "1.1.8"
