# Mimas's eccentricity is free, and its own dissipation would damp it: Meyer and Wisdom
# (2008) find it the remnant of a past resonance, the Mimas-Dione 3:1 e²-Mimas resonance
# among them, which they place 0.70 Gyr ago for a Saturn Q of 18,000, with an equilibrium
# eccentricity of 0.07 for a Mimas k2/Q of 3.0e-6, an equilibrium heating of 1.9 GW. Saturn
# dissipates 8.4 times as fast as that Q gives (k2/Q 1.59e-4, Lainey et al. 2017): the
# resonance 83 Myr ago, supplying 16 GW, 32.8 mW/m². Lainey et al. (2024) find an ocean
# under 20 to 30 km of ice younger than 25 Myr, and Walker and Rhoden that its melting
# began when the eccentricity stood at two to three times its present value. The episode is
# stated from the capture to the present; the moon's own dissipation decides when it
# escaped (F138).
