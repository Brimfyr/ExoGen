# Miranda's coronae formed over upwellings in its ice while tides heated it (Hammond and
# Barr 2014), at a heat flow of 31 to 112 mW/m² by the faults of Arden Corona
# (Beddingfield et al. 2015). The heat came from the Ariel-Umbriel 5:3 resonance, which
# excited Miranda's eccentricity chaotically for hundreds of millions of years, about a
# gigayear ago for Uranus's Q of 15,000 to 20,000 (Cuk et al. 2020). Their runs with
# Miranda's Q/k2 at 100, the dissipation the engine gives it, keep its eccentricity at
# 0.02 or less. At 0.0165 its tides heat it to about 62 mW/m², the middle of the faults'
# range and of the 34 to 84 mW/m² Arden's flexure gives (Hammond and Barr 2014). The
# episode is centred a gigayear ago and lasts three hundred million years; nothing is
# pinned.
